services:
  api:
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    restart: unless-stopped
    command: ["python", "-m", "agentops_runtime.compose_services", "api"]
    ports:
      - "${AGENTOPS_API_PORT:-8710}:8710"
    environment:
      - HERMES_RUNTIME_MODE=agentops
      - HERMES_BACKEND_PROFILE=compose-self-hosted
      - AGENTOPS_DATABASE_URL=postgresql://agentops:${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}@postgres:5432/${AGENTOPS_POSTGRES_DB:-agentops}
      - AGENTOPS_DEEP_MEMORY_DB_URL=postgresql://agentops:${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}@postgres:5432/${AGENTOPS_POSTGRES_DB:-agentops}
      - AGENTOPS_QUEUE_URL=redis://redis:6379/0
      - AGENTOPS_ARTIFACT_ENDPOINT=http://minio:9000
      - AGENTOPS_ARTIFACT_BUCKET=${AGENTOPS_ARTIFACT_BUCKET:-agentops-artifacts}
      - AGENTOPS_ARTIFACT_ROOT=/var/lib/agentops/artifacts
      - AGENTOPS_SESSION_DB_PATH=/var/lib/agentops/sessions/sessions.db
      - AGENTOPS_CURATED_MEMORY_DB_PATH=/var/lib/agentops/curated-memory/curated.db
      - AGENTOPS_SKILL_DB_PATH=/var/lib/agentops/skills/skills.db
      - AGENTOPS_QUEUE_DB_PATH=/var/lib/agentops/queue/queue.db
      - AGENTOPS_RUN_LEASE_DB_PATH=/var/lib/agentops/run-leases/run-leases.db
      - AGENTOPS_CRON_DB_PATH=/var/lib/agentops/cron/cron.db
      - AGENTOPS_CONVERSATION_ROUTER_DB_PATH=/var/lib/agentops/conversations/conversations.db
      - AGENTOPS_WORKER_REGISTRY_DB_PATH=/var/lib/agentops/worker-registry/workers.db
      - AGENTOPS_DELIVERY_DB_PATH=/var/lib/agentops/delivery/delivery.db
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713
      - AGENTOPS_API_URL=http://api:8710
    volumes:
      - agentops-artifacts:/var/lib/agentops/artifacts
      - agentops-sessions:/var/lib/agentops/sessions
      - agentops-curated-memory:/var/lib/agentops/curated-memory
      - agentops-skills:/var/lib/agentops/skills
      - agentops-queue:/var/lib/agentops/queue
      - agentops-run-leases:/var/lib/agentops/run-leases
      - agentops-cron:/var/lib/agentops/cron
      - agentops-conversations:/var/lib/agentops/conversations
      - agentops-worker-registry:/var/lib/agentops/worker-registry
      - agentops-delivery:/var/lib/agentops/delivery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      local-secrets:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8710/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    restart: unless-stopped
    command: ["python", "-m", "agentops_runtime.compose_services", "worker"]
    environment:
      - HERMES_RUNTIME_MODE=agentops
      - HERMES_BACKEND_PROFILE=compose-self-hosted
      - AGENTOPS_DATABASE_URL=postgresql://agentops:${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}@postgres:5432/${AGENTOPS_POSTGRES_DB:-agentops}
      - AGENTOPS_QUEUE_URL=redis://redis:6379/0
      - AGENTOPS_ARTIFACT_ENDPOINT=http://minio:9000
      - AGENTOPS_ARTIFACT_BUCKET=${AGENTOPS_ARTIFACT_BUCKET:-agentops-artifacts}
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713
      - AGENTOPS_API_URL=http://api:8710
      - AGENTOPS_WORKER_MAX_CONCURRENT_RUNS=${AGENTOPS_WORKER_MAX_CONCURRENT_RUNS:-2}
      - AGENTOPS_SMOKE_FLEET_RUN_ID=${AGENTOPS_SMOKE_FLEET_RUN_ID:-}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8711/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  scheduler:
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    restart: unless-stopped
    command: ["python", "-m", "agentops_runtime.compose_services", "scheduler"]
    environment:
      - HERMES_RUNTIME_MODE=agentops
      - HERMES_BACKEND_PROFILE=compose-self-hosted
      - AGENTOPS_DATABASE_URL=postgresql://agentops:${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}@postgres:5432/${AGENTOPS_POSTGRES_DB:-agentops}
      - AGENTOPS_QUEUE_URL=redis://redis:6379/0
      - AGENTOPS_ARTIFACT_ENDPOINT=http://minio:9000
      - AGENTOPS_ARTIFACT_BUCKET=${AGENTOPS_ARTIFACT_BUCKET:-agentops-artifacts}
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713
      - AGENTOPS_API_URL=http://api:8710
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8712/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${AGENTOPS_POSTGRES_DB:-agentops}
      - POSTGRES_USER=agentops
      - POSTGRES_PASSWORD=${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}
    volumes:
      - agentops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d ${AGENTOPS_POSTGRES_DB:-agentops}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${AGENTOPS_MINIO_ROOT_USER:-agentopsminio}
      - MINIO_ROOT_PASSWORD=${AGENTOPS_MINIO_ROOT_PASSWORD:-agentops-minio-dev-password}
    volumes:
      - agentops-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  local-secrets:
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    restart: unless-stopped
    command: ["python", "-m", "agentops_runtime.compose_services", "local-secrets"]
    environment:
      - HERMES_RUNTIME_MODE=agentops
      - HERMES_BACKEND_PROFILE=compose-self-hosted
      - AGENTOPS_DATABASE_URL=postgresql://agentops:${AGENTOPS_POSTGRES_PASSWORD:-agentops-dev-password}@postgres:5432/${AGENTOPS_POSTGRES_DB:-agentops}
      - AGENTOPS_QUEUE_URL=redis://redis:6379/0
      - AGENTOPS_ARTIFACT_ENDPOINT=http://minio:9000
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713
      - AGENTOPS_API_URL=http://api:8710
      - AGENTOPS_SECRET_STORE_PATH=/var/lib/agentops/secrets/secrets.db
    volumes:
      - agentops-secrets:/var/lib/agentops/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8713/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  smoke:
    profiles: ["smoke"]
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    command: ["python", "-m", "agentops_runtime.compose_health_smoke"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      local-secrets:
        condition: service_healthy
    environment:
      - AGENTOPS_API_URL=http://api:8710
      - AGENTOPS_WORKER_URL=http://worker:8711
      - AGENTOPS_SCHEDULER_URL=http://scheduler:8712
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713

  durable-smoke:
    profiles: ["smoke"]
    build:
      context: ../..
    image: agentops-hermes-runtime:local
    command: ["python", "-m", "agentops_runtime.compose_durable_smoke"]
    depends_on:
      api:
        condition: service_healthy
      local-secrets:
        condition: service_healthy
    environment:
      - AGENTOPS_API_URL=http://api:8710
      - AGENTOPS_SECRET_STORE_URL=http://local-secrets:8713
      - AGENTOPS_SMOKE_EXPECTED_WORKERS=${AGENTOPS_SMOKE_EXPECTED_WORKERS:-0}
      - AGENTOPS_SMOKE_FLEET_RUN_ID=${AGENTOPS_SMOKE_FLEET_RUN_ID:-}

volumes:
  agentops-postgres:
  agentops-redis:
  agentops-minio:
  agentops-artifacts:
  agentops-sessions:
  agentops-curated-memory:
  agentops-skills:
  agentops-queue:
  agentops-run-leases:
  agentops-cron:
  agentops-secrets:
  agentops-conversations:
  agentops-worker-registry:
  agentops-delivery:
